  <meta charset="UTF-8">

  <title>วิศวกรรมยกปรับระดับอาคาร แก้ไขบ้านทรุด เสริมฐานรากไมโครไพล์</title>
  
  <meta name="description" content="บริการซ่อมบ้านทรุด ยกปรับระดับอาคาร และดึงโครงสร้างด้วยระบบไฮดรอลิก โดย หจก. สถาปนิกปั้นบ้าน เสริมฐานรากไมโครไพล์ ปลอดภัย มีวิศวกรควบคุมงาน พร้อมรับประกัน 5 ปีเต็ม">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --color-terracotta: #BA5A3A;
      --color-sage: #8A9A86;
      --color-navy: #2A445D;
      --color-cream: #F5F2EB;
      --color-charcoal: #2F3E46;
      --color-crimson: #C84B31;
      
      --bg-dark: #0f141c;
      --card-bg: rgba(26, 34, 46, 0.85);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --line-green: #06c755;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Sarabun', sans-serif;
    }
    
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(186, 90, 58, 0.18) 0%, transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(42, 68, 93, 0.45) 0%, transparent 50%),
        linear-gradient(180deg, #0d1117 0%, #151a24 100%);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    
    /* Container */
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    
    /* Tech Header */
    .hero-card {
      background: linear-gradient(135deg, rgba(42, 68, 93, 0.75) 0%, rgba(62, 39, 43, 0.85) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 36px 24px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4), 0 0 30px rgba(186, 90, 58, 0.15);
      margin-bottom: 22px;
    }
    
    .hero-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--color-terracotta), var(--color-crimson), var(--color-sage));
    }
    
    .badge-tech {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(186, 90, 58, 0.2);
      border: 1px solid var(--color-terracotta);
      color: #ff9b7d;
      padding: 4px 14px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    
    .hero-title {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 10px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }
    
    .hero-desc {
      font-size: 14.5px;
      color: var(--text-muted);
      max-width: 460px;
      margin: 0 auto 18px;
      line-height: 1.5;
    }

    .warranty-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(42, 68, 93, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 13px;
      color: #e2e8f0;
    }

    .warranty-badge i {
      color: #fbbf24;
    }
    
    /* Stats Bar */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 22px;
    }
    
    .stat-item {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 14px 8px;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    
    .stat-number {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .stat-number i {
      font-size: 16px;
      color: var(--color-terracotta);
    }
    
    .stat-label {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    
    /* Section Title */
    .section-title {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin: 22px 0 12px 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }
    
    /* Dynamic Action Links */
    .action-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .action-btn {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(186, 90, 58, 0.4);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    
    .action-btn.primary {
      background: linear-gradient(135deg, rgba(6, 199, 85, 0.15) 0%, rgba(42, 68, 93, 0.3) 100%);
      border-color: rgba(6, 199, 85, 0.4);
    }
